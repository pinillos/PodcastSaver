[project]
name = "podcast-kb"
version = "0.1.0"
description = "Base de conocimiento de transcripciones de podcasts de IA"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
podcast-kb = "podcast_kb.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_kb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
