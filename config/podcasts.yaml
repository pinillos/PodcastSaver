# Fuente de verdad del alta de podcasts (§4.1 del diseño).
# SQLite es caché derivada: si divergen, gana este fichero.
#
# `rss_url` se puede dejar vacío si hay `apple_id`: el sync lo resuelve vía
# itunes.apple.com/lookup (§2.3) y lo cachea en SQLite.

podcasts:
  - slug: ia-semanal
    title: Inteligencia Artificial Semanal
    authors: Gargoyles Devon
    language: es
    apple_id: "1723256857"   # = https://pod.link/1723256857
    # Feed de origen, autoalojado y verificado: 95 episodios (ene-2025 →
    # ago-2026, ~68 h). Sin prefijos de tracking ni publicidad dinámica, así
    # que los timestamps no derivan (§9.1). No numera episodios y no publica
    # transcripciones, así que no hay atajo de §4.4.
    rss_url: https://podcast.lamesalimon.com/lamesalimon.xml
    # Otros orígenes del mismo podcast, por si el principal cayera:
    #   iVoox f12364979 → https://www.ivoox.com/feed_fg_f12364979_filtro_1.xml
    #   YouTube UC4ewDq9cCPd9eqA88M6yvEQ

  - slug: test-de-turing
    title: El Test de Turing - IA Aplicada a Negocio
    authors: Álvaro Peña, Arnau Vendrell, Víctor Mollá
    language: es
    apple_id: "1771978939"
    # Verificado: 166 episodios (may-2025 → ago-2026, ~239 h). Anchor incrusta
    # la URL real de CloudFront en el enclosure, así que la identidad se toma
    # de esa (§4.2). 58 episodios traen índice de capítulos en las show notes.
    # Es hosting de Spotify: asumir publicidad dinámica (§9.1).
    rss_url: https://anchor.fm/s/e1671d44/podcast/rss

  - slug: la-tertul-ia
    title: "La Tertul-IA: Inteligencia Artificial y más"
    authors: Lu Martín, Frankie Carrero, Corti
    language: es
    apple_id: "1723736263"
    # Verificado: 127 episodios (ene-2024 → ago-2026, ~141 h). 18 traen índice
    # de capítulos en las show notes. Anchor: misma URL incrustada que el Test
    # de Turing, y misma advertencia de publicidad dinámica (§9.1).
    rss_url: https://anchor.fm/s/107b28204/podcast/rss
    # OJO (§2.2): estos episodios salen también dentro de "Growth: el podcast
    # de Product Hackers" (Apple 1236733939). NO dar de alta ese feed sin
    # tener en cuenta el dedupe global por enclosure.
    # OJO (§2.1): no confundir con "La TERTULia de la Inteligencia Artificial"
    # (Apple 1669083682), que es otro podcast distinto.

  - slug: monos-estocasticos
    title: monos estocásticos
    authors: Antonio Ortiz, Matías S. Zavia
    language: es
    # Verificado: 178 episodios (ene-2023 → jul-2026, ~216 h). El mejor feed
    # de los cuatro: 128 episodios traen transcripción en VTT con marcas de
    # tiempo (§4.4), 59 traen capítulos y los 178 declaran los hablantes con
    # <podcast:person>, que resuelve el mapeo de §5.11 sin trabajo manual.
    # Alojado en Cuonda, sin tracking ni URL incrustada.
    rss_url: https://cuonda.com/monos-estocasticos/feed
