# Indexado desatendido: al hacer push de transcripciones nuevas, se trocean,
# se vectorizan y se cargan en Supabase — con el Mac apagado (§3.2).
#
# Requiere el secreto PODCAST_KB_DSN. Mientras no exista, el paso se salta en
# vez de fallar, para no dar rojos antes de que haya despliegue.

name: index

on:
  push:
    branches: [main]
    paths:
      - "transcripts/**/*.md"
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PODCAST_KB_DSN: ${{ secrets.PODCAST_KB_DSN }}
      EMBEDDER: ${{ vars.EMBEDDER || 'hashing' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Indexar las transcripciones nuevas
        if: env.PODCAST_KB_DSN != ''
        run: uv run podcast-kb index --embedder "$EMBEDDER"

      - name: Sin despliegue configurado
        if: env.PODCAST_KB_DSN == ''
        run: echo "::notice::No hay PODCAST_KB_DSN configurado; no se indexa nada."
